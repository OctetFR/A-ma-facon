nd, pour retrouver l’envie et les moyens d’apprendre.`,intro:`Née au croisement de la psychologie et de la pédagogie, la psychopédagogie considère la personne dans sa globalité\xA0: ce qu’elle pense, ce qu’elle ressent et la façon dont elle s’y prend pour apprendre.`,whatTitle:`Ce que c’est`,what:[`Quand les difficultés s’accumulent, ce n’est jamais seulement une question de notes. La confiance s’effrite, le stress monte, la motivation s’éteint, et l’apprentissage se bloque encore davantage.`,`La psychopédagogie cherche à rompre ce cercle. Elle tient compte de trois dimensions à la fois\xA0: le développement psychologique, le fonctionnement cognitif (attention, mémoire, raisonnement) et les apprentissages eux-mêmes. Elle ne remplace pas l’école\xA0: elle aide à y retrouver sa place.`],areasTitle:`Ce qu’on travaille`,areas:[{title:`Confiance et estime de soi`,text:`Repérer ses forces, oser se tromper, sortir du «\xA0je suis nul\xA0».`},{title:`Motivation`,text:`Redonner du sens au travail scolaire et retrouver le plaisir de comprendre.`},{title:`Méthodes de travail`,text:`S’organiser, planifier, mémoriser, réviser sans s’épuiser.`},{title:`Attention et concentration`,text:`Connaître son fonctionnement et l’ajuster, notamment en cas de trouble de l’attention.`},{title:`Émotions et stress`,text:`Apprivoiser l’anxiété des évaluations et la peur de l’échec.`},{title:`Se connaître comme apprenant`,text:`Prendre conscience de ses stratégies et de ce qui fonctionne vraiment pour soi.`}],tools:`Les outils sont choisis selon l’âge et les besoins\xA0: cartes mentales, gestion mentale, jeux pédagogiques, exercices de lecture et d’écriture, techniques de détente et de concentration.`,stepsTitle:`Comment se passe un suivi`,steps:[{title:`Premier entretien`,text:`Écouter la personne et sa famille, comprendre l’histoire de la difficulté.`},{title:`Observation`,text:`Voir comment elle travaille, repérer ce qui freine et ce qui aide.`},{title:`Séances régulières`,text:`Des séances individuelles avec des objectifs concrets et atteignables.`},{title:`Lien avec l’entourage`,text:`Des échanges avec les parents et, si besoin, l’école, pour avancer dans le même sens.`}],noteTitle:`Bon à savoir`,note:`La psychopédagogue n’est ni psychologue ni médecin\xA0: elle ne pose pas de diagnostic et ne fait pas de thérapie. Lorsque c’est utile, elle oriente vers le professionnel adapté.`},{id:`orthopedagogie`,tone:`dark`,title:`L’orthopédagogie`,tagline:`Évaluer précisément ce qui bloque, puis intervenir de façon ciblée.`,intro:`L’orthopédagogie est une discipline des sciences de l’éducation spécialisée dans l’évaluation et l’intervention auprès des personnes qui ont, ou risquent d’avoir, des difficultés d’apprentissage.`,whatTitle:`Ce que c’est`,what:[`«\xA0Ortho\xA0» vient du grec et signifie «\xA0droit\xA0»\xA0: il s’agit de remettre sur la bonne voie un apprentissage qui a pris un mauvais chemin.`,`L’orthopédagogue ne se contente pas de refaire les exercices de l’école. Elle cherche d’abord à comprendre pourquoi une notion ne passe pas, puis l’enseigne autrement, pas à pas, jusqu’à ce que l’apprentissage tienne et se transfère en classe.`],areasTitle:`Ce qu’on travaille`,areas:[{title:`Lecture`,text:`Déchiffrage, fluidité, compréhension de texte, vocabulaire.`},{title:`Écriture`,text:`Orthographe, grammaire, rédaction et organisation des idées.`},{title:`Mathématiques`,text:`Sens du nombre, calcul, résolution de problèmes, raisonnement.`},{title:`Bases du langage écrit`,text:`Conscience phonologique\xA0: entendre, isoler et manipuler les sons de la langue.`},{title:`Stratégies d’apprentissage`,text:`Planifier, vérifier son travail, se corriger seul\xA0: devenir autonome.`},{title:`Troubles des apprentissages`,text:`Une intervention adaptée en cas de dyslexie, dysorthographie, dyscalculie…`}],tools:`L’intervention s’appuie sur un enseignement explicite et progressif\xA0: on montre, on pratique ensemble, puis seul, avec du matériel adapté et beaucoup d’entraînement guidé.`,stepsTitle:`Comment se passe un suivi`,steps:[{title:`Évaluation`,text:`Des tâches ciblées et des outils reconnus pour dresser un portrait précis\xA0: les difficultés, mais aussi les forces.`},{title:`Plan d’intervention`,text:`Des objectifs précis, définis à partir de ce portrait et partagés avec la famille.`},{title:`Intervention`,text:`Des séances individuelles, centrées sur les notions et les stratégies à construire.`},{title:`Suivi des progrès`,text:`Des mesures régulières pour vérifier ce qui fonctionne et ajuster l’intervention.`}],noteTitle:`Bon à savoir`,note:`L’orthopédagogue travaille en complément des autres professionnels\xA0: orthophoniste, psychologue, neuropsychologue, médecin. Elle ne pose pas de diagnostic médical, mais son évaluation éclaire les besoins et peut orienter vers un bilan.`}],forWhom:{id:`pour-qui`,title:`Pour qui\xA0?`,intro:`J’accompagne les enfants, les adolescents et les adultes, chacun à son âge et à son rythme. Que la difficulté soit récente ou installée depuis longtemps, on part de ce qui fonctionne déjà pour construire la suite.`,groups:[{title:`Les enfants`,lead:`Les premiers apprentissages posent les bases. Quand la lecture, l’écriture ou les nombres résistent, mieux vaut agir tôt, sans dramatiser.`,situationsLabel:`Je peux aider quand\xA0:`,situations:[`la lecture reste hésitante ou les lettres s’inversent`,`l’orthographe et la production d’écrits sont fragiles`,`le calcul et les problèmes deviennent un obstacle`,`les devoirs tournent au conflit à la maison`,`l’enfant perd confiance et se dit «\xA0nul\xA0»`,`un trouble est soupçonné ou diagnostiqué\xA0: dyslexie, dysorthographie, dyscalculie…`],note:`Les parents sont associés au suivi et repartent avec des pistes concrètes pour la maison.`},{title:`Les adolescents`,lead:`Les exigences augmentent et la motivation peut flancher. C’est souvent là que d’anciennes difficultés refont surface.`,situationsLabel:`Je peux aider quand\xA0:`,situations:[`les méthodes de travail et l’organisation manquent`,`le stress des évaluations prend toute la place`,`la procrastination ou la démotivation s’installent`,`le décrochage scolaire menace`,`le français ou les mathématiques restent difficiles`,`un choix d’orientation se prépare`],note:`L’adolescent est acteur de son suivi\xA0: on fixe ensemble des objectifs qui ont du sens pour lui.`},{title:`Les adultes`,lead:`Il n’est jamais trop tard pour apprendre autrement. Beaucoup d’adultes portent depuis l’enfance des difficultés jamais prises en charge.`,situationsLabel:`Je peux aider quand\xA0:`,situations:[`vous reprenez des études ou une formation`,`vous préparez un examen ou un concours`,`lire ou écrire vous gêne au travail`,`un trouble d’apprentissage a été découvert tard`,`vous voulez reprendre confiance en vos capacités`],note:`Un accompagnement qui s’adapte à vos contraintes, à votre emploi du temps et à vos objectifs.`}],closing:`Vous ne savez pas si votre situation relève de la psychopédagogie ou de l’orthopédagogie\xA0? Un premier échange permet de faire le point ensemble.`,cta:`Prendre rendez-vous`},images:{bare:`https://assets.uberdesigner.ai/easylog-hanae/log-bare.webp`,reveal:`https://assets.uberdesigner.ai/easylog-hanae/log-reveal.webp`}};async function Mi(e,t,n){let r=e.map(()=>0),i=e.map(()=>0),a=e.map(()=>!1),o=0,s=0,c=()=>{let n;if(o===e.length){let e=i.reduce((e,t)=>e+t,0),t=r.reduce((e,t)=>e+t,0);n=e>0?Math.min(1,t/e):0}else n=a.filter(Boolean).length/e.length;n>s&&(s=n,t(n))};return Promise.all(e.map(async(e,t)=>{let s=await fetch(e,{signal:n});if(!s.ok)throw Error(`Failed to load ${e}: ${s.status}`);let l=Number(s.headers.get(`Content-Length`));l>0&&(i[t]=l,o+=1);let u;if(s.body){let e=s.body.getReader(),n=[];for(;;){let{done:i,value:a}=await e.read();if(i)break;n.push(a),r[t]+=a.byteLength,c()}u=new Blob(n,{type:s.headers.get(`Content-Type`)??`image/webp`})}else u=await s.blob(),r[t]=u.size;return a[t]=!0,c(),createImageBitmap(u)}))}var Ni={root:`_root_1w3k9_1`,canvas:`
